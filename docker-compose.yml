services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: contapp-backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - contapp-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: contapp-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - contapp-network

networks:
  contapp-network:
    driver: bridge
